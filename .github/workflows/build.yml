name: Build

# A runner starts from nothing every time. A clean clone either builds, installs
# and is consumable by an external project, or it does not.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows (MSVC)
    runs-on: windows-2026

    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg_cache
      LOOM_INSTALL_DIR: ${{ github.workspace }}/_install

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Point VCPKG_ROOT at the runner's vcpkg
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            throw "VCPKG_INSTALLATION_ROOT is not set on this image - the workflow needs to clone its own vcpkg"
          }
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Toolchain info
        shell: pwsh
        run: |
          cmake --version
          Write-Host "VCPKG_ROOT = $env:VCPKG_ROOT"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            & $vswhere -products * -format value -property displayName
          } else {
            Write-Host "vswhere not found"
          }

      - name: Configure
        run: cmake --preset msvc

      - name: Build Debug
        run: cmake --build --preset msvc-debug

      - name: Build Release
        run: cmake --build --preset msvc-release

      - name: Check output shape
        shell: pwsh
        run: |
          # Static build: no DLLs, no import libraries. Guards against a silent
          # regression back to SHARED.
          $bad = Get-ChildItem Build -Recurse -Include *.dll,*.exp -ErrorAction SilentlyContinue
          if ($bad) {
            $bad | ForEach-Object { Write-Host "Unexpected artifact: $($_.FullName)" }
            throw "Static build produced shared-library artifacts"
          }
          Get-ChildItem Build -Recurse -Include *.exe,*.lib | ForEach-Object { Write-Host $_.FullName }

      # ---- Install and prove the engine is consumable ------------------------

      - name: Install engine (Debug + Release)
        shell: pwsh
        run: |
          cmake --install Generated/msvc --prefix "$env:LOOM_INSTALL_DIR" --config Debug
          cmake --install Generated/msvc --prefix "$env:LOOM_INSTALL_DIR" --config Release
          echo "LOOM_ROOT=$env:LOOM_INSTALL_DIR" >> $env:GITHUB_ENV

      - name: Verify install layout
        shell: pwsh
        run: |
          # Debug and Release libraries must coexist. Without CMAKE_DEBUG_POSTFIX
          # the second install silently overwrites the first, and consumers hit
          # _ITERATOR_DEBUG_LEVEL / RuntimeLibrary link errors.
          $lib = Join-Path $env:LOOM_INSTALL_DIR "lib"
          foreach ($f in @('LoomCore.lib','LoomCored.lib','LoomRender2D.lib','LoomRender2Dd.lib')) {
            if (-not (Test-Path (Join-Path $lib $f))) {
              throw "Missing $f - Debug and Release libraries are overwriting each other"
            }
          }
          # The engine must ship its own dependencies.
          $sdl = Join-Path $env:LOOM_INSTALL_DIR "third-party/share/sdl3/SDL3Config.cmake"
          if (-not (Test-Path $sdl)) { throw "Bundled SDL3 missing from the install" }
          Write-Host "Install layout OK"

      - name: Build consumer project against the install
        shell: pwsh
        working-directory: Tests/InstallSmokeTest
        run: |
          cmake --preset msvc
          cmake --build --preset msvc-debug
          cmake --build --preset msvc-release

      - name: Run consumer project
        shell: pwsh
        working-directory: Tests/InstallSmokeTest
        run: |
          foreach ($cfg in @('Debug','Release')) {
            Write-Host "--- $cfg ---"
            & ".\Generated\msvc\$cfg\LoomInstallSmokeTest.exe"
            if ($LASTEXITCODE -ne 0) { throw "$cfg smoke test failed with exit code $LASTEXITCODE" }
          }

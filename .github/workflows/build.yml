name: Build

# The point of this workflow is that a runner starts from nothing every time.
# A clean clone either builds or it does not — no stale local artifacts to hide
# a broken build.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows (MSVC)
    # Pinned, not windows-latest. The msvc preset asks for the "Visual Studio 17
    # 2022" generator, so the image has to actually ship VS 2022. -latest moves
    # between images and will eventually stop doing that.
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Toolchain info
        shell: pwsh
        run: |
          cmake --version
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            & $vswhere -products * -format value -property catalog_productLineVersion
            & $vswhere -products * -format value -property displayName
          } else {
            Write-Host "vswhere not found"
          }

      - name: Configure
        run: cmake --preset msvc

      - name: Build Debug
        run: cmake --build --preset msvc-debug

      - name: Build Release
        run: cmake --build --preset msvc-release

      - name: Check output shape
        shell: pwsh
        run: |
          # Static build: no DLLs, no import libraries. Guards against a silent
          # regression back to SHARED.
          $bad = Get-ChildItem Build -Recurse -Include *.dll,*.exp -ErrorAction SilentlyContinue
          if ($bad) {
            $bad | ForEach-Object { Write-Host "Unexpected artifact: $($_.FullName)" }
            throw "Static build produced shared-library artifacts"
          }
          Get-ChildItem Build -Recurse -Include *.exe,*.lib | ForEach-Object { Write-Host $_.FullName }
